<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CMCHS Staff Schedule" />
    <!-- ?v=N bumped by hand whenever icon-192.png's content actually changes, so
         browsers (which cache favicons somewhat independently of normal assets)
         are forced to refetch instead of showing a stale cached icon. -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png?v=2" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png?v=2" />
    <title>CMCHS Staff Schedule</title>
    <!-- Light/dark before first paint (same rule as src/utils/theme.js): the
         person's saved choice, otherwise the device setting. -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('css_theme') } catch (e) {}
        if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#161618')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
